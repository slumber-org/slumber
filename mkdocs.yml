site_name: SLUMBER
site_description: Sleep Logging and Unsupervised Monitoring through BioElectrical Recordings
site_url: https://slumber-org.github.io/slumber/

repo_url: https://github.com/slumber-org/slumber
repo_name: slumber-org/slumber
edit_uri: edit/main/docs/

copyright: © 2026 SLUMBER contributors

# Stable QR paths (/explore/, /survey/, /updates/). Change destinations here only.
extra:
  redirects:
    explore: "https://github.com/slumber-org/slumber"
    survey: "https://ipvs.informatik.uni-stuttgart.de/sc/limesurvey/index.php/654257?lang=en"
    updates: "https://f3276afc.sibforms.com/serve/MUIFAKyj8ooJQyX9K5AyIgi7x0yfpoM7dk9nISy6cfL99TIoplHAe2vmrQFwzJXKeeOar-_OnLd6gG5-OLHNK_E4mlg9XFspv8jEO4NT1fGppj6cQwDmudPWrlqpE9jQ1crDHYSo47es_wkDZKLh6joWmvBTUdeGoaz59g68DRgmhuuJ40KCEPn57JkQ7nxYjiJRpkr_mP1jHTPGAA=="

hooks:
  - hooks/redirects.py

plugins:
  - search

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.expand
    - navigation.path
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  logo: assets/logo.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

nav:
  - Home: index.md

  - Getting Started:
      - Installation: getting-started/installation.md
      - Your First Study: getting-started/first-study.md

  - Concepts:
      - Overview: concepts/overview.md
      - Glossary: concepts/glossary.md
      - Run Lifecycle: concepts/run-lifecycle.md

  - User Guide:
      - Overview: user-guide/index.md
      - Study Setup: user-guide/study-setup.md
      - Writing Conditions: user-guide/writing-conditions.md
      - Paths and Placeholders: user-guide/paths-and-placeholders.md
      - Validating a Study: user-guide/validating-a-study.md
      - Running a Study: user-guide/running-a-study.md
      - Participant UI: user-guide/participant-ui.md
      - Run Output and Logging: user-guide/run-output-and-logging.md

  - Reference:
      - CLI: reference/cli.md
      - Configuration: reference/configuration.md
      - Plugins: reference/plugins.md
      - UI: reference/ui.md

  - About:
      - Roadmap: about/roadmap.md
      - Contributing: about/contributing.md
