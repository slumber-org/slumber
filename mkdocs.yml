site_name: SLUMBER
site_description: Sleep Logging and Unsupervised Monitoring through BioElectrical Recordings

repo_url: https://github.com/slumber-org/slumber
repo_name: slumber-org/slumber
edit_uri: edit/develop/docs/

copyright: Copyright &copy; Ali Saberi

plugins:
  - search

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.expand
    - navigation.path
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

nav:
  - Home: index.md

  - Getting Started:
      - Installation and Setup: getting-started/installation-setup.md

  - User Guide:
      - Overview: user-guide/index.md
      - Study Setup: user-guide/study-setup.md
      - Config Validation: user-guide/config-validation.md
      - Condition Sync: user-guide/condition-sync.md
      - Run Layout and Logging: user-guide/run-layout-logging.md
      - Running a Study: user-guide/study-run.md
      - NiceGUI Participant UI: user-guide/nicegui-ui.md

  - Reference:
      - CLI: reference/cli-reference.md
      - Schemas: reference/schemas.md
      - Plugins: reference/plugins.md
      - UI Backends: reference/ui-backends.md
      - Backend (Supabase / Postgres): reference/backend.md

  - About:
      - Contributing: about/contributing.md
