[project]
name = "slumber"
version = "0.1.0"
description = "Sleep Logging and Unsupervised Monitoring through BioElectrical Recordings"
readme = "README.md"
authors = [
    { name = "Ali Saberi", email = "ali.saberi96@gmail.com" },
    { name = "Tinke van Buijtene", email = "tinke@kpnmail.nl"}
]
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "ezmsg>=3.7.3",
    "loguru>=0.7.3",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "typer>=0.24.1",
]

[project.scripts]
slumber = "slumber:main"

[project.entry-points."slumber.activities"]
instruction = "slumber.ui.activities.instruction:InstructionActivity"
sleep = "slumber.ui.activities.sleep:SleepActivity"

[project.entry-points."slumber.units"]
clock = "slumber.pipeline.units.clock:ClockUnit"
jsonl_writer = "slumber.pipeline.units.jsonl_writer:JsonlWriterUnit"

# Extensions may register extra Typer apps under slumber.cli (e.g. auth, db).
# Core discovers them at startup via slumber.cli.extensions.load_cli_extensions.

[project.optional-dependencies]
somnio = [
    "slumber-somnio",
]
supabase = [
    "slumber-supabase",
]
sentry = [
    "sentry-sdk>=2.0.0",
]
nicegui = [
    "nicegui>=2.0.0",
]

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    {include-group = "lint"},
    {include-group = "docs"},
    {include-group = "test"},
    "pre-commit>=4.5.0",
]
lint = [
    "ruff>=0.14.6",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.0.0",
    "pymdown-extensions>=10.0",
]
test = [
    "pytest>=9.0.2",
]

[tool.uv.workspace]
members = ["extensions/*"]

[tool.uv.dependency-groups]
dev = {requires-python = ">=3.12"}

[tool.uv.sources]
slumber = { workspace = true }
slumber-somnio = { workspace = true }
slumber-audio = { workspace = true }
slumber-supabase = { workspace = true }
# TODO: Switch somnio back to PyPI (remove git source override).
somnio = { git = "https://github.com/alitsaberi/somnio.git" }

[tool.pytest.ini_options]
testpaths = ["tests", "extensions/slumber-supabase/tests"]
markers = [
    "supabase: tests requiring slumber[supabase] (client, SQLModel, Alembic stack)",
    "nicegui: tests requiring slumber[nicegui]",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint]
extend-select = ["TD001", "TD007", "UP031", "UP032"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
