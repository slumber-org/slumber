[project]
name = "slumber"
version = "0.1.0"
description = "Sleep Logging and Unsupervised Monitoring through BioElectrical Recordings"
readme = "README.md"
authors = [
    { name = "Ali Saberi", email = "ali.saberi96@gmail.com" },
    { name = "Tinke van Buijtene", email = "tinke@kpnmail.nl"}
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
slumber = "slumber:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    {include-group = "lint"},
    {include-group = "docs"},
    "pre-commit>=4.5.0",
]
lint = [
    "ruff>=0.14.6",
]
docs = [
    "mkdocs>=1.6.0",
]

[tool.uv.dependency-groups]
dev = {requires-python = ">=3.12"}

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
