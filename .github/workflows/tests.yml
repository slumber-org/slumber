name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install core dependencies only
        run: uv sync --locked --dev

      - name: Run tests (no optional extras)
        env:
          SLUMBER_PYTEST_CORE_ONLY: "1"
        run: uv run pytest -m "not supabase and not nicegui"

      - name: Install all dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        env:
          SLUMBER_PYTEST_CORE_ONLY: "0"
        run: uv run pytest
